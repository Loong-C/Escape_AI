[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-ai"
version = "0.1.0"
description = "Computational research platform for the Escape abstract strategy game"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6,<7",
  "typer>=0.16,<1",
]

[project.scripts]
escape-ai = "escape_ai.cli:app"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pybind11>=2.13,<4",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
research = [
  "duckdb>=1.4,<2",
  "pyarrow>=20,<25",
]
training = [
  "torch>=2.11,<2.12",
]
server = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.40,<1",
]
openspiel = [
  "open-spiel>=1.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=build/pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["escape_ai"]
